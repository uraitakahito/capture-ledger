syntax = "proto3";

package browserhive.v1;

// BrowserHive の capture API。
//
// **1 往復で結果が返る。** `Capture` は取り込みが終わるまで返らず、応答に結果を載せる。
// 以前は HTTP の 202 に倣って「受理して taskId を返し、あとで GetCapture で取りに来る」
// 形だったが、その理由(proxy の timeout)は gRPC + HTTP/2 の LAN 内配備には無く、
// 形だけが残って呼ぶ側にポーリングを強いていた。
//
// この server は **browser 1 台ぶん** しか知らない。並列は呼ぶ側(orchestrator)が
// endpoint を並べて作る。だから queue も pool も無く、走行中に呼ばれたら待たせずに
// RESOURCE_EXHAUSTED を返す —— 空いている台を探すのは呼ぶ側の仕事。
//
// 失敗は gRPC の status code で返す。対応は handlers 側のコメントに書いてある。
service CaptureService {
  // 取り込んで、**結果を返す**。受理では返らない。
  //
  //   検証エラー            -> INVALID_ARGUMENT
  //   走行中(1 台 1 件)      -> RESOURCE_EXHAUSTED  呼ぶ側は別の台へ、無ければ少し待って再度
  //   browser に繋がらない   -> UNAVAILABLE
  //
  // client が途中で切ったら (cancel / deadline)、取り込みはページごと壊されて cancelled の
  // 結果になる。応答は届かないが、manifest には切られた記録が書かれる。
  //
  // 応答は、結果の記録 (manifest) を書き終えてから返す (書き込みの予算は 10 秒)。
  rpc Capture(CaptureRequest) returns (CaptureResponse);

  // この台の現在。**server 全体**の話で、取り込み 1 件のことは言わない —— 結果は
  // Capture の応答にしか無い。health と版の probe、それと呼ぶ側が「いま塞がっているか」
  // を投げる前に知るために在る。
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
}

// -- enum ------------------------------------------------------------------

// capture の結末。
enum CaptureStatus {
  CAPTURE_STATUS_UNSPECIFIED = 0;
  CAPTURE_STATUS_SUCCESS = 1;
  CAPTURE_STATUS_FAILED = 2;
  CAPTURE_STATUS_TIMEOUT = 3;
  CAPTURE_STATUS_HTTP_ERROR = 4;
}

// 署名の検査 1 つぶんの結果。
enum CheckOutcome {
  CHECK_OUTCOME_UNSPECIFIED = 0;
  CHECK_OUTCOME_OK = 1;
  CHECK_OUTCOME_FAILED = 2;
  CHECK_OUTCOME_SKIPPED = 3;
}

// 失敗の分類。
enum ErrorType {
  ERROR_TYPE_UNSPECIFIED = 0;
  ERROR_TYPE_HTTP = 1;
  ERROR_TYPE_TIMEOUT = 2;
  ERROR_TYPE_CONNECTION = 3;
  ERROR_TYPE_SIGNING = 4;
  ERROR_TYPE_INTERNAL = 5;
  // 成果物を書き込み先 (自前の bucket、または呼ぶ側の受け口) へ置けなかった。
  // 書けなかった成果物はどこにも残らないので、取り込みは丸ごと失われている。
  // 書き込み先を直して投げ直す。message は書き込み先から始まる。
  ERROR_TYPE_ARTIFACT_SINK = 6;
  // 呼ぶ側が途中で切った(deadline / cancel)。取り込みは打ち切られ、成果物は残らない。
  ERROR_TYPE_CANCELLED = 7;
}

// この取り込みが、前のタスクの残留物を持ち越すかどうか。
//
// 0 番に ISOLATED を置いているのは意図的で、この repo の他の enum が守っている
// `_UNSPECIFIED = 0` の慣習を破っている。proto3 のスカラ enum は「未設定」と「0」を
// 区別できないので、0 を ISOLATED にすれば「指定しなかった」と「隔離を頼んだ」が
// 同じものになる —— つまり **「指定しなかったのに持ち越されていた」が表現できなく
// なる**。かつて cache と reset_state という 3 つのつまみでそれを表そうとして、
// どれも origin ストレージを覆っておらず、www.yahoo.co.jp のフィードが
// アーカイブに入らないことに 1 年近く誰も気づかなかった。
enum SessionMode {
  // 既定。使い捨ての BrowserContext で取り込む。cookie / HTTP キャッシュ /
  // localStorage / sessionStorage / IndexedDB / Service Worker がすべて空から始まる。
  SESSION_MODE_ISOLATED = 0;
  // worker が持ち回る BrowserContext とタブを使う。ログイン後の連続取り込みなど、
  // 持ち越すことが目的のときだけ選ぶ。同じ worker に載った **無関係なタスクにも
  // 状態が漏れる** ことを承知の上で。後始末は一切しない。
  SESSION_MODE_SHARED = 1;
}

// -- リクエスト側 ----------------------------------------------------------

// 取得する形式。少なくとも 1 つは true でなければならない (handlers が検証する)。
// URL への扱い。順序付きの一覧の 1 項目で、最初に当たったものが効く。
message UrlPolicy {
  // URL 全体に当てる glob。ワイルドカードは `*` のみ。
  string pattern = 1;
  // deny | no-archive | no-body。
  //
  // **enum ではなく string**。proto の enum は知らない値を UNRECOGNIZED に潰すので、
  // 新しい action を足したとき古いサーバがそれを黙って別物として扱う ——
  // 「送らないつもりで送っていた」が起こりうる。string ならサーバ側の検証で
  // INVALID_ARGUMENT にでき、呼ぶ側は自分の要求が通らなかったことを知れる。
  string action = 2;
}

// メディア型への扱い。応答が届いてからしか判定できないので deny は取りえない。
message ContentTypePolicy {
  string prefix = 1;
  // no-body のみ。
  string action = 2;
}

// `repeated` を包むための箱。
//
// proto3 の repeated は **空と未設定を区別できない**。この API ではその差が
// 意味を持つ —— 空の一覧は「何も濾さないで」という指示で、未設定は
// 「サーバ既定に任せる」。message で包めば presence が付き、型そのものが
// 「言及したかどうか」を表す。bool のフラグを添えるより誤用しにくい。
message UrlPolicyList {
  repeated UrlPolicy policies = 1;
}

message ContentTypePolicyList {
  repeated ContentTypePolicy policies = 1;
}

message CaptureFormats {
  bool png = 1;
  bool webp = 2;
  bool html = 3;
  bool links = 4;
  bool mhtml = 5;
  bool wacz = 6;
}

// 大きな固定オーバーレイを消す第 2 パスの閾値。省略時はサーバ既定。
message DismissHeuristicSpec {
  optional bool enabled = 1;
  optional double min_viewport_coverage_ratio = 2;
  optional int32 min_z_index = 3;
}

// banner / modal の除去を 1 回の capture だけ調整する。
message DismissSpec {
  optional bool use_defaults = 1;
  repeated string extra_selectors = 2;
  repeated string exclude_frameworks = 3;
  optional DismissHeuristicSpec heuristic = 4;
  optional bool fail_on_error = 5;
}

// viewport の指定。
//
// proto は値域を書けないので、範囲は server 側の境界 (request-limits.ts) が
// 強制する。外れると INVALID_ARGUMENT。
message Viewport {
  // 1–7680 (8K の幅)。
  int32 width = 1;
  // 1–4320 (8K の高さ)。
  int32 height = 2;
}

// 走らせるもの 1 つぶん。どれを走らせるかと、どう設定するかを 1 つにする。
//
// oneof にしているので、存在しない behavior は **綴れない**。かつては id が
// ただの文字列で、`autoscrol` と打ち間違えても黙って通り、何も走らないまま
// 取り込みが成功していた。
message Behavior {
  oneof kind {
    AutoScroll autoscroll = 1;
    AutoFetch autofetch = 2;
    AutoPlay autoplay = 3;
    Custom custom = 4;
  }
}

// 省いた値はサーバ既定へ落ちる (optional なので presence がある)。既定値は
// src/config/defaults.ts に在り、両者の一致は lint:behavior-roster が見る。

// ページの全高までスクロールして、遅延読み込みを発火させる。
message AutoScroll {
  // 既定 40。
  optional int32 max_steps = 1;
  // 既定 250。
  optional int32 step_delay_ms = 2;
  // 既定 1000。
  optional int32 idle_time_ms = 3;
}

// srcset の全候補と data-* の遅延属性を能動的に取りに行く。
message AutoFetch {
  // 既定 2000。
  optional int32 max_urls = 1;
}

// <video> / <audio> をミュート再生して、その資源を取りに行く。
message AutoPlay {
  // 既定 1000。
  optional int32 settle_ms = 1;
}

// client が持ち込む behavior。サーバが --allow-custom-behaviors で起動している
// ときだけ効き、そうでなければ黙って無視される。
message Custom {
  // behavior report に出る識別子。
  string id = 1;
  // { static id, static isMatch, run(ctx) } を実装した JS のクラス式。
  string source = 2;
  // この behavior に渡す値。中身が任意の JS である以上、その設定も型では守れない
  // —— JSON の逃げ道はここだけに閉じてある。
  optional string options_json = 3;
}

// 走らせるものの列。message で包んでいるのは `optional` を付けるため: proto3 の
// repeated には presence が無く、空と未指定を区別できない。
message BehaviorList {
  repeated Behavior items = 1;
}

// capture ごとの behavior の指定。
message BehaviorSpec {
  // 1 から 4 は builtins (repeated string) / options / site_behaviors /
  // custom が使っていた。番号を再利用しない —— 旧 client が送る
  // `builtins = ["autoscroll"]` は 1 番の length-delimited で、そのまま
  // 別の型として読むと沈黙して化ける。予約しておけば未知として捨てられ、
  // サーバ既定に落ちる。
  reserved 1, 4;
  reserved "builtins", "custom";

  // 走らせるものを、走らせる順に。
  //
  //   省略 → サーバ既定 (--behaviors) をそのまま走らせる
  //   items が空 → 1 つも走らせない
  //   並び → 走らせるものを **書き切ったもの**
  //
  // 最後の 1 行が肝で、「既定の集合はそのままで設定だけ差し替える」はできない。
  // かつては有効集合と設定が別々に届いたのでそれができ、同時に「集合を空に
  // したつもりが既定に戻っていた」も起きていた。
  optional BehaviorList behaviors = 5;

  // 同梱の site behavior を対象にするか。省略するとサーバ既定 (出荷時は on)。
  // `behaviors` と別なのは性質が違うから —— site behavior は host を見る
  // isMatch() が門番で、client が並べるものではない。
  optional bool site_behaviors = 3;
}

// 成果物の送り先。**呼ぶ側が 1 回きりの口を渡し、こちらはそこへ押し出す。**
//
// これを送ると、この取り込みの成果物はサーバの保管庫ではなく `url` へ PUT される。
// server は bucket も prefix も知らず、置き場所を選べない —— 選ぶのは口を出した側で、
// 応答が最終的な location を返す。
//
// **省略できる。** 省略すればサーバ自身の保管庫へ書く従来の経路になるので、
// 2 つの経路は同じ server で同時に生きられる。
message ArtifactSink {
  // PUT の宛先。`<url>/<filename>` へ 1 成果物ずつ送る。
  string url = 1;
  // 呼ぶ側が発行した 1 回きりの資格。`authorization: Bearer <token>` で送る。
  //
  // **これが権限そのもの。** server はこれ以上のものを持たないので、
  // 他の取り込みの成果物に触れる手段が無い。
  string token = 2;
}

// Capture の要求。取り込みの中身を全部ここで決める —— 応答は結果そのもの
// (`CaptureResponse`)で、受理の印は無い。
message CaptureRequest {
  string url = 1;
  // 成果物のファイル名に入る札。使える文字の制限は無い —— 名前を組むときに
  // 区切りと衝突する文字は %XX へ逃がされるので、空白も `_` も `/` も日本語も
  // そのまま渡せる。制限は **合計の長さ** だけで、
  // `{taskId}_{correlationId}[_{labels}].result.json` が 255 UTF-8 バイトを
  // 超える要求は境界が拒む。逃がされる文字と非 ASCII は 1 文字 3 バイト。
  repeated string labels = 2;
  // client 側の相関キー。labels と同じ規則でファイル名に入る。
  // 送らなかった場合も名前の枠は残る (`{taskId}__{labels}` のように下線が並ぶ) ——
  // 枠が固定されているので、名前から元の値を読み戻せる。
  optional string correlation_id = 3;
  CaptureFormats capture_formats = 4;
  // 上流へ送る Accept-Language。印字可能な ASCII のみ、200 文字以下。
  // 制御文字 (CR/LF/NUL) は header への注入になるので境界が拒む。
  optional string accept_language = 5;
  // wacz-auth の署名を求める。`capture_formats.wacz` と一緒のときだけ有効で、
  // 他の組み合わせは INVALID_ARGUMENT で拒む。
  optional bool signing = 6;

  // true/false だけの指定と、細かい指定を区別する必要があるので oneof にする。
  oneof dismiss_banners {
    bool dismiss_banners_enabled = 7;
    DismissSpec dismiss_banners_spec = 8;
  }

  // リクエスト単位の viewport。値域 (1–7680 × 1–4320) は server 側の境界
  // (request-limits.ts) が強制する。
  optional Viewport viewport = 9;
  // 0–5000。ページ操作 1 つごとに挟む遅延で、headless の描画を眺めるためのもの。
  // 待ちの手段ではないので上限が要る (1 操作ごとに効き、操作は十数回ある)。
  //
  // 操作ごとの timeout の予算の **外側** で数える —— わざと遅くした取り込みは
  // 固まった取り込みではない。効くのはタスク全体の予算だけ。
  optional int32 operation_delay_ms = 10;
  optional bool trace = 11;
  // 退役した番号。**再利用しない。**
  //
  // 13 と 14 は archive_mode (enum) と device_scale_factor が使っていた。旧 client が
  // 送る archive_mode = ARCHIVE_MODE_MULTIPASS は 13 番の varint 2 で、そのまま
  // repeated int32 として読むと device_pixel_ratios = [2] に化ける。「1 と 2 で
  // 読み込め」が「DPR 2 だけで撮れ」になり、しかも誰も気づかない。
  //
  // 12・17・18 は cache と reset_state が使っていた。session に畳んで消したが、
  // 番号は同じ理由で空けておく —— capture-ledger は この .proto を vendoring していて
  // (`proto:sync` が要る)、同期を忘れると古い番号のまま喋る。実際に一度起きている。
  // 予約しておけば未知のフィールドとして捨てられ、サーバ既定 (= 隔離) に落ちる。
  // 予約しなければ、同じ wire type の別フィールドとして黙って読まれる。
  reserved 12, 13, 14, 17, 18;
  reserved "cache", "archive_mode", "device_scale_factor",
           "reset_state_enabled", "reset_state_spec";

  // 読み込む device pixel ratio を、読み込む順に。各要素は 1–3 の整数で
  // (2 が Retina、3 が現行の携帯端末の上)、同じ値を 2 度置くことはできない。
  //
  // 要素数がそのまま読み込みの回数になる。読み込むたびにバナー除去も behaviors も
  // 走るので、所要時間も WARC のバイト数も要素数に比例して増える。
  //
  // 順序に意味がある: PNG / WebP は読み込みが全部終わってから 1 度だけ撮るので、
  // **最後の要素**の倍率になる。[2, 1] と書けば画像は 1x で残る。
  //
  // 空ならサーバ既定 (--device-pixel-ratios)。proto3 の repeated は「空」と
  // 「未指定」を区別できないので、空は「指定なし」として扱うほかない。
  repeated int32 device_pixel_ratios = 20;
  optional bool full_page = 15;
  optional BehaviorSpec behaviors = 16;

  // 前のタスクの残留物を持ち越すか。省略 = ISOLATED (使い捨ての context)。
  SessionMode session = 21;

  // この取り込みに限って本文の上限を締める。省略時はサーバ既定 (GetServerStatus の
  // limits.max_response_bytes)。
  //
  // 動くのは締める方向だけで、既定より大きい値は既定に丸める。上限は資源を守る
  // ために運用者が置くもので、呼ぶ側が上げられるならそれは上限ではない。拒否では
  // なく丸めにしているのは、呼ぶ側が配備の既定を知らずに要求できるようにするため
  // —— 効いた値は archive の settings.limits.max_response_bytes に残るので、
  // 何が起きたかは後から読める。
  optional int64 max_response_bytes = 19;

  // この取り込みに限って policy を差し替える。**丸ごと置き換え** で、サーバ既定とは
  // 混ざらない。空の一覧は「何も濾さない」という指示で、省略 (サーバ既定に任せる) とは別。
  //
  // 上限 (max_response_bytes) と違って丸めない。到達してよい範囲を守るのは
  // この層の仕事ではないので、締める方向に縛る理由が無い。
  //
  // 効いた一覧は archive の settings.urlPolicies に順序のまま残り、
  // サーバ既定は GetServerStatus の default_url_policies で読める。
  optional UrlPolicyList url_policies = 22;
  optional ContentTypePolicyList content_type_policies = 23;

  // この取り込みに限って、web storage の **値** まで archive に入れるかを決める。
  // 省略時はサーバ既定 (--storage-values)。
  //
  // 目録 (browserhive:capture.storage) は値の有無に関わらず必ず載る。これが足すのは
  // storage/origins.jsonl の値のほうで、どちらであるかは目録の valuesRecorded が述べる。
  //
  // 既定が off なのは、web storage が bearer token や session 識別子を日常的に持ち、
  // それが WARC の payload のどこにも現れないため。**true を送ることは、archive を
  // 渡すことがそれらを渡すことになる、と引き受けること。**
  //
  // optional なのは false を送れるようにするため。サーバ既定が on の配備で、
  // この取り込みだけ値を出さない、が言えなければならない。
  optional bool storage_values = 24;

  // 成果物の送り先。省略するとサーバ自身の保管庫へ書く (従来どおり)。
  //
  // 保管庫を持たない配備では**必須**で、無ければ受理の時点で断る ——
  // 撮ってから「置けません」は、この系でいちばん高くつく失敗。
  optional ArtifactSink artifact_sink = 25;
}

message GetServerStatusRequest {}

// -- 結果 ------------------------------------------------------------------

// Capture の応答。結果そのものと、それを記録できたか。
message CaptureResponse {
  // 成果物と manifest(`.result.json`)の鍵。ここで初めて呼ぶ側に渡る。
  string task_id = 1;
  CaptureResultReport report = 2;
  // report を `.result.json` として書けたか。書けなかったなら、この応答が唯一の記録。
  // report の中には無い —— 自分の書き込みの結末を、書き込む本文には書けないため。
  ManifestOutcome manifest = 3;
}

// 結果の記録 (manifest) の結末。
message ManifestOutcome {
  oneof outcome {
    // 書けた場所 (`s3://…`、または受け口が返した場所)。
    string location = 1;
    // 書けなかった理由。書き込み先から始まる。
    string error = 2;
  }
}

// 成果物の置き場所 (s3://…)。取得しなかった形式は空のまま。
message CaptureArtifacts {
  optional string png = 1;
  optional string webp = 2;
  optional string html = 3;
  optional string links = 4;
  optional string mhtml = 5;
  optional string wacz = 6;
}

message WaczStats {
  int32 total_recorded = 1;
  // 内部では totalWithheld と呼ぶもの (deny または no-archive の policy に一致し、
  // request / response のレコードを書かなかったリクエスト)。
  //
  // **名前を変えていない。** 数える集合は 7.0.0 から変わっておらず、変わったのは
  // 呼び方だけ。wire の名前は archive の語彙とは別の契約で、読んでいるのは
  // grpcurl を叩く手元のスクリプトのような **こちらから見えない相手**。
  // 意味が同じものを改名して、その全部を黙って壊す理由が無い。
  int32 total_blocked = 2;
  int32 total_skipped_content_type = 3;
  int32 total_truncated_too_large = 4;
  int32 total_truncated_task_cap = 5;
  int32 total_failed = 6;
  int32 total_incomplete = 7;
  int64 total_body_bytes = 8;
  // deny の policy により、リクエスト自体を送らなかったもの。total_withheld の内数。
  //
  // 送ったかどうかは証憑としての意味を変える —— 送っていれば相手のサーバに
  // 痕跡が残り、送っていなければ残らない。
  int32 total_denied = 9;
}

message WaczSignatureChecks {
  CheckOutcome signature = 1;
  CheckOutcome chain = 2;
  CheckOutcome domain = 3;
  CheckOutcome timestamp = 4;
}

message WaczSignature {
  bool signed = 1;
  optional string reason = 2;
  optional string domain = 3;
  optional WaczSignatureChecks checks = 4;
}

message WaczCompleteness {
  repeated string bodyless_urls = 1;
  repeated string truncated_urls = 2;
  bool complete = 3;
}

message CaptureErrorDetails {
  ErrorType type = 1;
  string message = 2;
  optional int32 http_status_code = 3;
  optional string http_status_text = 4;
  optional int32 timeout_ms = 5;
  // 時間切れか cancel で終わったとき、取り込みがどの段階に居たか。
  // check-address / start-recording / load-pages / write-formats / package-wacz / upload-wacz。
  // message の末尾にも、段階の中の細部と経過とともに同じことが書いてある。
  optional string step = 6;
}

message CaptureResultReport {
  string task_id = 1;
  optional string correlation_id = 2;
  string url = 3;
  repeated string labels = 4;
  CaptureStatus status = 5;
  optional int32 http_status_code = 6;
  string timestamp = 7;
  int32 capture_processing_time_ms = 8;
  CaptureArtifacts artifacts = 11;
  optional WaczStats wacz_stats = 12;
  optional WaczCompleteness completeness = 13;
  optional WaczSignature signature = 14;
  optional CaptureErrorDetails error_details = 15;
}

// -- status ----------------------------------------------------------------

// この台が抱えている browser。
message BrowserStatus {
  string url = 1;
  bool connected = 2;
  // Chromium が自称する版(例 `Chrome/150.0.7871.181`)。接続していないときは無い。
  optional string version = 3;
}

message BuildInfo {
  string version = 1;
  string revision = 2;
  string build_time = 3;
}

/**
 * サーバが強いる境界。リクエストでは変えられないもの。
 *
 * 投げる前に「この大きさは切り詰められる」と分かるために在る。archive 側の
 * settings.limits と同じ値だが、答える問いが違う —— あちらは「何が起きたか」、
 * こちらは「これから何が起きるか」。
 *
 * 載せるのは境界だけ。viewport や devicePixelRatios はリクエストで上書きできるので
 * 境界ではなく、ここには来ない。設定の置き場にし始めたら、それは status とは
 * 別の RPC に切る合図。
 */
message ServerLimits {
  /** 1 レスポンスの本文の上限。超えた本文は落とし、切り詰めとして記録する。 */
  int64 max_response_bytes = 1;
  /** 1 タスクが記録する本文の合計の上限。 */
  int64 max_task_bytes = 2;
  /** 1 タスクが同時に抱える保留リクエストの上限。 */
  int32 max_pending_requests = 3;
}

message GetServerStatusResponse {
  // 走行中の取り込みが在るか。true のとき Capture は RESOURCE_EXHAUSTED を返す。
  bool busy = 1;
  BrowserStatus browser = 2;
  BuildInfo build = 3;
  ServerLimits limits = 4;
  repeated UrlPolicy default_url_policies = 5;
  repeated ContentTypePolicy default_content_type_policies = 6;
}
