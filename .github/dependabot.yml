# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# Dependabot が読むのは **default branch (main) に置かれたこのファイル** だけ。
# `target-branch` は「PR をどこへ出すか」を指すだけで、設定の置き場所ではない。
# develop にだけ置いても効かないので、両方に同じものを入れてある。
#
# この repo は pnpm の workspace で、lockfile は root の pnpm-lock.yaml 1 本だけ。
# したがって npm の entry も **root の 1 つだけ**。`directory: /` が docs-site を
# 含む workspace 全体を見る (docs-site/package.json と lockfile を一緒に更新する)。
#
# `directory: /docs-site` の entry を足してはならない。docs-site/package.json だけを
# 書き換えて root の lockfile に触らない PR ができ、CI が
# ERR_PNPM_OUTDATED_LOCKFILE で必ず落ちる —— 2026-08-22 に実際にそうなった。
# 分けたいのは groups であって entry ではないので、下の `docs-site` グループで
# パターンごと切り出している。
#
# ecosystem は pnpm でも `npm`。dependabot は pnpm-lock.yaml をこの ecosystem で
# 扱う。
version: 2
updates:
  # ── アプリ本体 ──
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # 版が枯れてから PR 化する(supply-chain 対策)。security 更新には適用されない
    cooldown:
      default-days: 3
      semver-major-days: 7
    # グループ 3 つ (docs-site / production / development) に対して 4。
    # docs-site の entry を畳んだので、旧構成の 3 + 1 と同じ本数になる。
    open-pull-requests-limit: 4
    versioning-strategy: increase
    labels:
      - dependencies
    ignore:
      # typescript は major を上げない。
      #
      # typescript-eslint がまだ TS 7 に対応していない —— 最新の 8.69.0 でも peer は
      # `typescript: >=4.8.4 <6.1.0`。上げると lint が
      #   Error: typescript-eslint does not support TS 7.0.
      # で **必ず** 落ちる。変更の中身とは無関係に。fixtures #72 が実際にそうなった。
      #
      # **対応版が出たらこの entry を消すこと。** 確認は:
      #   npm view typescript-eslint@latest peerDependencies.typescript
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # docs-site/package.json に書いてある依存は、全部このグループへ。
      #
      # **順番には頼らない。** 文書には「最初に一致したグループへ入る」とあり、以前はここに
      # 「dependency-type のグループより先に置けば紛れない」と書いていたが、2026-09 に実際は
      # そうならなかった —— docs の依存が dependency-type の側にも入り、割れ方は
      # docs-site/package.json の dependencies / devDependencies の線と一致した:
      #
      #   #267 (production)  に @astrojs/starlight と mermaid
      #   #287 (development) に @astrojs/markdown-satteri と satteri
      #
      # starlight 0.42 は markdown-satteri 0.4 以上が要るので、別々の PR に分かれると
      # 片方だけでは docs のビルドが落ちる。原因は特定できていない (Dependabot の実行ログは
      # GitHub の画面にしか無い)。だから原因に依らない形にしてある —— 下の 2 つのグループから
      # `exclude-patterns` で同じ依存を除き、どの順で評価されても混ざらないようにする。
      #
      # **3 か所の並びは同じにすること。** 依存を docs-site/package.json に足したら、3 か所とも足す。
      docs-site:
        patterns:
          - "astro"
          - "astro-*"
          - "@astrojs/*"
          - "mermaid"
          - "satteri"
          - "sharp"
      production-dependencies:
        dependency-type: production
        exclude-patterns:
          - "astro"
          - "astro-*"
          - "@astrojs/*"
          - "mermaid"
          - "satteri"
          - "sharp"
      development-dependencies:
        dependency-type: development
        exclude-patterns:
          - "astro"
          - "astro-*"
          - "@astrojs/*"
          - "mermaid"
          - "satteri"
          - "sharp"

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    # github-actions は default-days のみ対応
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - ci
    groups:
      actions:
        patterns:
          - "*"

  # ── Docker base image ──
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    labels:
      - docker
