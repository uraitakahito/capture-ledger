name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # vendored proto が submodule の proto と一致しているか。
  #
  # `proto:sync` は submodule から `proto/` へ cp するだけなので、submodule を上げても
  # sync を忘れれば古い契約のまま喋る。実際に一度それで通り抜けている。
  #
  # `check` job とは別に切ってあるのは submodule が要るから —— BrowserHive は private
  # なので既定の GITHUB_TOKEN では clone できず、App token を鋳造する手順が要る。
  # それを毎 PR の全部の検査に背負わせるより、この 1 本だけに閉じるほうが安い。
  #
  # store の名前の検査 (`check:store-name`) も同じ理由でここに居る。見るのは proto では
  # ないが、submodule を取る job がこれだけで、検査の実体 (check-store-name.sh) は
  # submodule の中にある。
  #
  # **検査であって修正ではない。** `pnpm run proto:generate` は頭で sync するが、
  # ここで呼ぶのは `proto:diff` のほう。sync を通してから比べると、ずれを自分で直して
  # しまって必ず緑になる (実際にその形で書いて、反証したら素通りした)。
  proto-sync:
    name: Proto sync check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Dependabot が出した PR では走らせない。
    #
    # この job は browserhive の submodule を読むために GitHub App の鍵を要るが、
    # **Dependabot の PR は Actions secrets を読めない** (Dependabot は独立した
    # secret 置き場を持つ)。したがって `secrets.SUBMODULE_APP_KEY` は空文字になり、
    # create-github-app-token が "The 'private-key' input must be set to a
    # non-empty string" で落ちる —— 変更の中身とは無関係に、必ず。
    #
    # 飛ばして失うものは無い。この job が見るのは「vendor した proto が submodule と
    # 一致するか」と「compose の SeaweedFS の版が submodule の原本と同じか」で、
    # Dependabot の PR が書き換えるのは package.json と lockfile (docker の entry なら
    # Dockerfile、github-actions の entry なら workflow) で、proto/ にも
    # docker-compose.yml にも触らないので、どれも動かない。
    # しかも develop に入った直後の push で同じ job が (secrets 付きで) 走るため、
    # 検査そのものは消えない —— 前倒しでなくなるだけ。
    #
    # **site.yaml の同じ if は事情が違う** —— あちらが見る docs のビルドは、依存の版上げで
    # 壊れうる。飛ばして失うものが在るので、向こうのコメントを読むこと。
    #
    # 前倒しのまま保ちたいなら、repo の **Dependabot secrets** に
    # SUBMODULE_APP_KEY を置けばこの if は外せる。
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      # 手順の由来は docs.yaml の同じブロックを参照。App は repo をまたいで共有する
      # 前提で名前が付いている。
      - uses: actions/create-github-app-token@v3
        id: submodule-token
        with:
          client-id: ${{ vars.SUBMODULE_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            capture-ledger
            browserhive
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ steps.submodule-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Vendored proto matches the submodule
        run: pnpm run proto:diff
      - name: The store is named the shared one everywhere
        run: pnpm run check:store-name

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: capture_ledger
          POSTGRES_PASSWORD: capture_ledger
          POSTGRES_DB: capture_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U capture-ledger -d capture-ledger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://capture_ledger:capture_ledger@localhost:5432/capture_ledger

    steps:
      - uses: actions/checkout@v7

      # setup-node より前に置くこと。cache: 'pnpm' は pnpm が PATH に居ないと
      # ストアの場所を解決できない。版は package.json の packageManager から読む。
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Apply migrations
        run: node dist/db/migrate.js up

      - name: Migration round-trip (down then up)
        run: |
          node dist/db/migrate.js down
          node dist/db/migrate.js up

      # 撮る対象の CLI (pnpm run targets) を、本物の Postgres に当てる。
      #
      # 試験は DB を立てないので、CLI の SQL が Postgres で本当に通るか、`015` の制約
      # (組織の既定値なし・URL の CHECK・組織ごとのユニーク) が本当に効くかを見るのは、
      # ここだけ。自分の組織 (smoke-<pid>) の行だけを足して、最後に消す。
      - name: Targets CLI against Postgres
        run: node scripts/targets-smoke.mjs

      - name: Proto drift check
        run: pnpm run proto:check

      # Separate from the drift check: that one asks whether the generated tree
      # matches the .proto, this one asks whether what it imports will still be
      # installed in the prod-only layer the runtime image is built from.
      # pnpm does not hoist, so a package that only resolved by hoisting now
      # fails during development too — this stays as the second line of defence.
      - name: Generated dependency check
        run: pnpm run proto:check-deps

      # pnpm-workspace.yaml の overrides が、まだ要るか。
      #
      # override は、入れた理由が消えた後も黙って効き続け、将来の版上げを曲げる。
      # 「○○ が上がったら外す」という条件は、人の記憶に置いた時点で忘れられる ——
      # 2026-09 に調べたら、axios の override はすでに何もしていなかった。
      # 要・不要の線引きは scripts/check-overrides.mjs の冒頭に書いてある。
      - name: Overrides are still needed
        run: pnpm run check:overrides

      # `.env.example` が、コードが実際に読む環境変数とずれていないか。
      #
      # `pnpm run check` にも入れてあるが、この job は `check` を呼ばず個別の
      # ステップを並べる形なので、片方だけでは CI に入らない。
      #
      # 雛形が腐ると「これで全部だ」と信じて使われ、足りないときに疑う先が
      # 残らない。.env はこの雛形の写し (cp -n .env.example .env) なので、ずれは
      # そのまま「必須の変数が欠けた .env」になって配られる。
      - name: Environment variable check
        run: pnpm run check-env

      # ソースのコメントが名指しするファイルが、まだ実在するか。
      #
      # docs については check-doc-refs.mjs が同じことを見ているが、**コメントは
      # 誰も見ていなかった。** run を crawl に畳んだとき、識別子は追随したのに
      # コメントには消えたファイルを現在形で指す記述が 19 箇所残り、うち 1 つは
      # 運用手順として「片付けは api/runs.ts の GET を見ること」と指示していた。
      - name: Comment reference check
        run: pnpm run check-comment-refs

      # `fga model test` runs the model in-process — no OpenFGA server needed.
      # These assertions are what stands between a one-line edit to
      # `fga/model.fga` and another organization's archives becoming readable,
      # so they run on every PR rather than only when the stack is up.
      - name: Install OpenFGA CLI
        run: |
          curl -fsSL "https://github.com/openfga/cli/releases/download/v0.7.19/fga_0.7.19_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin fga

      # `pnpm run <script> -- --flag` は npm と違って `--` をそのまま引数として
      # 渡す。capture-ledger の CLI は allowExcessArguments(false) なので、それは
      # "too many arguments" で即死する。npm から移したときの書き換え漏れは
      # ドキュメントの中でしか起きず、テストも lint も届かないので、ここで見る。
      # 中身は scripts/check-flag-style.mjs。**inline の shell に置かない** ——
      # 手元で走らせようが無い検査は、CI でしか気づけない検査になる。
      - name: No npm-style `--` before flags
        run: pnpm run check:flag-style

      # CI が並べるこの一覧と、package.json の `check` がずれていないか。
      #
      # **一覧は 2 か所に書かれている。** 片方だけ直すと、片側でしか走らない検査が
      # できる —— 直前の `--` の検査は、元は workflow の inline shell にしか無く、
      # 手元では走らせようが無かった。個別に並べる形は残す (どれが落ちたかが UI で
      # 分かる) 一方で、ずれは機械に禁じさせる。
      - name: CI と check の一覧が一致しているか
        run: pnpm run check:ci-parity

      - name: Authorization model tests
        run: pnpm run fga:test
