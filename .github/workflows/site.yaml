name: site

# Sync guard for the documentation site (Astro/Starlight).
#
# Builds docs-site/ and runs scripts/check-doc-refs.mjs so a pull request cannot
# merge documentation that has drifted from the repository:
#
#   - the build injects `// #region` snippets and resolves the BrowserHive pin
#     from the .upstream/browserhive submodule (docs-site/src/lib/extract.ts).
#     The pin is read from an .mdx page, so an uninitialised submodule fails
#     the build outright.
#   - check-doc-refs.mjs catches what the build does not: a page that exists in
#     only one language, a `src/….ts` path that was renamed, and a missing
#     `#region` marker — `astro build` logs that one but still exits 0, so it
#     cannot be relied on as a gate. (The difference is the extension: a throw
#     from an .mdx page surfaces through vite and fails the build, while on a
#     .md page Starlight's docs loader catches it. Every page carrying a
#     `#region` reference here is .md.)
#
# The pin now comes from the .upstream/browserhive submodule, so the checkout
# below needs it; docker-compose.yml stays in the paths filter because it is the
# build definition the docs describe.
#
# Security: read-only check. It never deploys and references no secrets, so
# running on pull_request (including from forks) is safe — unlike docs.yaml.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs-site/**"
      - "scripts/check-doc-refs.mjs"
      # The pinned BrowserHive version is read out of this submodule at build
      # time, so a bump can break the build (an off-tag pin fails `git
      # describe`) while touching nothing else the filter lists.
      - ".upstream/browserhive"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/site.yaml"
  pull_request:
    paths:
      - "src/**"
      - "docs-site/**"
      - "scripts/check-doc-refs.mjs"
      # The pinned BrowserHive version is read out of this submodule at build
      # time, so a bump can break the build (an off-tag pin fails `git
      # describe`) while touching nothing else the filter lists.
      - ".upstream/browserhive"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Docs sync guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependabot が出した PR では走らせない。理由は ci.yaml の proto-sync と同じ ——
    # **Dependabot の PR は Actions secrets を読めない** ので、下の
    # create-github-app-token が private-key 空で必ず落ちる。変更の中身とは無関係に。
    #
    # 飛ばして失うものは無い。この job が見るのは docs とコードの一致で、
    # Dependabot の PR は lockfile しか触らない。develop に入った直後の push で
    # 同じ job が secrets 付きで走るので、検査自体は消えない。
    if: github.actor != 'dependabot[bot]'
    steps:
      # BrowserHive is a private repository, so the default GITHUB_TOKEN cannot
      # clone the .upstream/browserhive submodule ("Repository not found" —
      # GitHub does not distinguish absent from unreadable). A GitHub App token
      # scoped to both repositories does.
      #
      # The token has to cover capture-ledger as well as browserhive: actions/checkout
      # uses the same credential for the superproject and its submodules.
      #
      # Setup (one time, outside this repo):
      #   1. A GitHub App with Contents: Read — uraitakahito-submodule-reader
      #      — installed with access to capture-ledger AND browserhive.
      #   2. Its Client ID as the repository variable SUBMODULE_CLIENT_ID and
      #      its private key as the secret SUBMODULE_APP_KEY. The numeric App
      #      ID also works, but the action calls that input legacy and GitHub
      #      recommends the client ID for the JWT it signs.
      #
      # The App is named for the job rather than for a repository because it
      # is meant to be shared: any other repo of this account that grows a
      # private submodule reuses the same App, key, and variable names, and
      # changes only the `repositories` list below.
      - uses: actions/create-github-app-token@v3
        id: submodule-token
        with:
          client-id: ${{ vars.SUBMODULE_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            capture-ledger
            browserhive
          # Narrow the minted token to exactly what a clone needs. This matters
          # if the App is one that also does something else — reusing the
          # reviewdog App, say, would otherwise hand this job its
          # pull-requests: write as well.
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          # The BrowserHive pin shown in the docs is read from the
          # .upstream/browserhive submodule via `git describe`.
          submodules: recursive
          token: ${{ steps.submodule-token.outputs.token }}
      # actions/checkout clones submodules shallow and without tag refs, so
      # `git describe --tags` — how the docs read the BrowserHive pin — finds
      # nothing ("No names found"). The commit is already checked out; this
      # just brings the tag names with it.
      - name: Fetch upstream tags
        run: git -C .upstream/browserhive fetch --tags --force
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site and verify doc references
        run: pnpm run site:check
