name: docs

# Publishes the Astro/Starlight site to GitHub Pages:
#
#   /capture-ledger/      → English
#   /capture-ledger/ja/   → Japanese
#
# Security:
#   - Triggered only by push to main and manual dispatch, never on
#     pull_request — that would build untrusted fork code with Pages
#     permissions. The read-only guard for PRs is site.yaml.
#   - Permissions are split per job: build gets contents:read; deploy gets
#     pages:write + id-token:write, required by deploy-pages' OIDC handshake.
#   - No secrets are referenced.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "docs-site/**"
      # The site renders the pinned BrowserHive version straight out of this
      # submodule (browserhivePin() shells out to `git describe --tags`), so a
      # bump changes a published page while touching nothing else. Without this
      # line the docs keep serving the previous version indefinitely.
      - ".upstream/browserhive"
      - "docker-compose.yml"
      - "package.json"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:

# One in-flight Pages deployment; queue rather than cancel so a running deploy
# finishes cleanly.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Astro/Starlight site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # BrowserHive is a private repository, so the default GITHUB_TOKEN cannot
      # clone the .upstream/browserhive submodule ("Repository not found" —
      # GitHub does not distinguish absent from unreadable). A GitHub App token
      # scoped to both repositories does.
      #
      # The token has to cover capture-ledger as well as browserhive: actions/checkout
      # uses the same credential for the superproject and its submodules.
      #
      # Setup (one time, outside this repo):
      #   1. A GitHub App with Contents: Read — uraitakahito-submodule-reader
      #      — installed with access to capture-ledger AND browserhive.
      #   2. Its Client ID as the repository variable SUBMODULE_CLIENT_ID and
      #      its private key as the secret SUBMODULE_APP_KEY. The numeric App
      #      ID also works, but the action calls that input legacy and GitHub
      #      recommends the client ID for the JWT it signs.
      #
      # The App is named for the job rather than for a repository because it
      # is meant to be shared: any other repo of this account that grows a
      # private submodule reuses the same App, key, and variable names, and
      # changes only the `repositories` list below.
      - uses: actions/create-github-app-token@v3
        id: submodule-token
        with:
          client-id: ${{ vars.SUBMODULE_CLIENT_ID }}
          private-key: ${{ secrets.SUBMODULE_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            capture-ledger
            browserhive
          # Narrow the minted token to exactly what a clone needs. This matters
          # if the App is one that also does something else — reusing the
          # reviewdog App, say, would otherwise hand this job its
          # pull-requests: write as well.
          permission-contents: read
      - uses: actions/checkout@v7
        with:
          # The BrowserHive pin shown in the docs is read from the
          # .upstream/browserhive submodule via `git describe`.
          submodules: recursive
          token: ${{ steps.submodule-token.outputs.token }}
      # actions/checkout clones submodules shallow and without tag refs, so
      # `git describe --tags` — how the docs read the BrowserHive pin — finds
      # nothing ("No names found"). The commit is already checked out; this
      # just brings the tag names with it.
      - name: Fetch upstream tags
        run: git -C .upstream/browserhive fetch --tags --force
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # site:check rather than site:build: the deployed site should never carry
      # a half-translated page or a stale snippet, and the check is seconds.
      - name: Build and verify
        run: pnpm run site:check
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
