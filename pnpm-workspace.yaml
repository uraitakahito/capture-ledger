# docs-site も同じ workspace に入れる。lockfile を 1 本にしておかないと、
# 「root は pnpm、docs-site は npm」という状態が残り、install が 2 回要る。
packages:
  - "docs-site"

# pnpm 11 は依存の lifecycle script を既定で実行しない。ここに挙がっているのは
# 「実行してよいか」を pnpm に聞かれたパッケージで、**どれも false でよい**
# ことを実測で確かめてある。
#
# 直感に反するが、どの postinstall も必須ではない:
#
#   esbuild       — docs-site (Astro) 経由。bin/esbuild は @esbuild/<platform> を
#                   **実行時に** 解決する Node のシム。platform パッケージは optional
#                   dependency として postinstall と無関係に入るので、false でも動く。
#                   (@bufbuild/buf と protobufjs も同じ形で false にしていた。BrowserHive
#                   v12 で proto が無くなり、どちらも依存から消えた。)
#   puppeteer     — docs の画面の絵を撮る (scripts/docs-shots.mjs) ためだけに在る。
#                   postinstall は Chromium (150MB) を取りに行くので、false にして
#                   install のたびに DL させない (CI でも要らない)。撮る人は初回だけ
#                   手で `./node_modules/.bin/puppeteer browsers install chrome`。
#                   .npmrc の PUPPETEER_SKIP_DOWNLOAD も同じ意図の二重の保険。
#                   capture-scheduler と同じ形。
#
# false でよいことの確かめ方 (このまま叩けば再現できる):
#
#   rm -rf node_modules
#   pnpm install --store-dir /tmp/pnpm-verify   # ← ストアを分けるのが肝
#   pnpm run site:build                         # → 17 ページ (esbuild が動いた証拠)
#
# node_modules を消すだけでは足りない。pnpm のストア (既定は
# ~/Library/pnpm/store) に前の postinstall の結果が残っていて link され直すので、
# 止めたことにならず検査が素通りする。実際に一度素通りした。
#
# postinstall がやるのはシムを実体の binary に置き換える最適化で、起動が少し
# 速くなる。それと引き換えに第三者の install script を走らせる価値は無いと
# 判断して false にしている。**増やすときは同じ手順で「本当に要るのか」を
# 確かめること** —— 要る/要らないは直感では当たらない。
allowBuilds:
  esbuild: false
  puppeteer: false

# npm の `overrides` の移設先。pnpm 11 は package.json の `overrides` を読まず、
# 書いても無視する (= 脆弱性修正が黙って失われる)。
#
# **override が要るのは、要求元の宣言した範囲が修正版と交わらないときだけ。** 交わるなら
# lockfile の更新で足り、後戻りは audit が止める。役目を終えた override は黙って版を縛り
# 続けるので、`pnpm run check:overrides` (scripts/check-overrides.mjs) が見張っている ——
# 要らなくなったものは CI が名指しする。
#
# **下限は「修正版そのもの」に置くこと。** override は範囲を狭めるだけで lockfile を進める
# 力は無いので、下限が脆弱な版を許していると、override があるのに古い版が居座り続ける
# (以前の brace-expansion がそうだった: 修正版は >=5.0.9 なのに、指定は ^5.0.8)。
#
# 2026-09 に外したもの (どちらも上の検査が「もう要らない」と判定した):
#   brace-expansion "^5.0.9" —— 要求元 minimatch 10.2.6 の範囲は ^5.0.8 で、lockfile は 5.0.9
#   axios "^1.18.1"          —— 要求元 @openfga/sdk 0.9.7 が 1.19.0 を完全一致で指定している
# js-yaml (旧 ^4.3.0) は、もともと移していない。修正版へは lockfile の更新で上がる。
# axios は、2026-10 に別の勧告で足し直した (下の axios の説明)。
#
# 2026-10 に外したもの (上の検査が「もう要らない」と判定した):
#   lodash-es "^4.18.1"      —— mermaid 12.1.0 が chevrotain を 13.2 に上げ、
#                              "4.17.23" ちょうどを求める要求元が消えた。残る dagre-d3-es 7.0.14 は ^4.17.21
overrides:
  # @openfga/sdk 0.9.7 (2026-10-01 の時点で最新) が、axios を "1.19.0" と **完全一致で** 指定している。
  # 1.19.0 は、2026-09-30 に公開された axios の勧告 7 件の対象で、修正版は 1.20.0。
  # high が GHSA-c29m-xwm3-cm6r・GHSA-mghh-pgcx-3jjj・GHSA-x97p-jq2g-jp4f・GHSA-3pq3-5fj3-cg6v・GHSA-542g-h47m-68v8、
  # moderate が GHSA-vh66-26gq-q6x8・GHSA-9fr6-4gfg-395g。
  # 完全一致の指定は lockfile の更新では動かせないので、ここは override でしか直せない。
  #
  # **外す条件: @openfga/sdk が、axios を 1.20.0 以上で指定する版を出したとき。**
  # 外せるようになれば、`pnpm run check:overrides` が名指しする。確かめ方: pnpm why axios
  axios: "^1.20.0"

  # @expressive-code/core 0.44.2（2026-10-11 の時点で最新。starlight が連れてくる）が、
  # postcss-nested を ^6.0.1 で要求している。postcss-nested 6 が連れてくる postcss-selector-parser 6 は、
  # GHSA-rj75-hqrm-r3gf（moderate、修正版は 7.1.6）の対象で、6 系に修正版は無い。
  # 7 に上げても、docs の build の出力（CSS と HTML）は変わらなかった。
  #
  # **外す条件: @expressive-code/core が、postcss-nested を 7 以上で要求する版を出したとき。**
  # 外せるようになれば、`pnpm run check:overrides` が名指しする。確かめ方: pnpm why postcss-nested
  "@expressive-code/core>postcss-nested": "^7.0.2"

  # mermaid 12.1.0（最新）が、katex を ^0.16.47 で要求している。0.16 系は
  # GHSA-238p-pmpm-9mq7（low、修正版は 0.18.2）の対象。0.18 に上げても、図は 6 枚とも描けた。
  #
  # **外す条件: mermaid が、katex を 0.18.2 以上で要求する版を出したとき。**
  "mermaid>katex": "^0.18.2"

# audit から外す勧告。外すのは、上流が修正版を受け取れず、override でも越えられないものだけ。
# 1 件ごとに、なぜ越えられないかと、外す条件を書く。
auditConfig:
  ignoreGhsas:
    # minimatch: globparts の増幅による DoS。修正は 11.0.1 (2026-10-27) からで、10 系・5 系には無い。
    # 要求元は eslint (^10.2.5)・@eslint/config-array (^10.2.4)・@typescript-eslint/typescript-estree
    # (^10.2.2) と、openapi-typescript 7.13 の下の @redocly/openapi-core 1.34 ("5.1.9" ちょうど)。
    # 2026-11-01 の時点で、どれの最新版も 10 系 (@redocly/openapi-core の 1 系は "5.1.9") を要求する。
    # @redocly/openapi-core は minimatch を関数として呼ぶ (5 系の CommonJS の形) が、10 系から先は
    # 関数ではなく名前付きの書き出しの入れ物なので、override で 11 にすると呼んだところで落ちる。
    # どれも devDependencies の道具 (lint と型の生成) で、本番イメージ (`pnpm install --prod`) には
    # 入らない。読むパターンも、この repo の設定と lint の対象だけ。
    # 外す条件: これらの親が 11.0.1 以上を要求する版を出したとき (そのとき update で直る)。
    # 確かめ方: pnpm why minimatch -r
    - GHSA-g3hv-75wg-m249
