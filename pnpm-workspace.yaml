# docs-site も同じ workspace に入れる。lockfile を 1 本にしておかないと、
# 「root は pnpm、docs-site は npm」という状態が残り、install が 2 回要る。
packages:
  - "docs-site"

# pnpm 11 は依存の lifecycle script を既定で実行しない。ここに挙がっているのは
# 「実行してよいか」を pnpm に聞かれたパッケージで、**どれも false でよい**
# ことを実測で確かめてある。
#
# 直感に反するが、上の 3 つの postinstall はどれも必須ではない:
#
#   @bufbuild/buf — bin/buf は platform 別のパッケージ (ここでは
#                   @bufbuild/buf-darwin-arm64) を **実行時に** 解決する Node の
#                   シム。platform パッケージは optional dependency として
#                   postinstall と無関係に入るので、false でも buf は動く。
#   esbuild       — docs-site (Astro) 経由。同じ形で、bin/esbuild が
#                   @esbuild/<platform> を実行時に解決する。
#   protobufjs    — @grpc/grpc-js 経由。postinstall は依存の版の書き方について
#                   stderr に助言を書くだけで、ファイルを 1 つも作らない
#                   (実物を読んで確認済み。副作用は process.stderr.write のみ)。
#   puppeteer     — docs の画面の絵を撮る (scripts/docs-shots.mjs) ためだけに在る。
#                   postinstall は Chromium (150MB) を取りに行くので、false にして
#                   install のたびに DL させない (CI でも要らない)。撮る人は初回だけ
#                   手で `./node_modules/.bin/puppeteer browsers install chrome`。
#                   .npmrc の PUPPETEER_SKIP_DOWNLOAD も同じ意図の二重の保険。
#                   capture-scheduler と同じ形。
#
# false でよいことの確かめ方 (このまま叩けば再現できる):
#
#   rm -rf node_modules
#   pnpm install --store-dir /tmp/pnpm-verify   # ← ストアを分けるのが肝
#   node_modules/.bin/buf --version             # → 1.72.0
#   pnpm run site:build                         # → 17 ページ
#
# node_modules を消すだけでは足りない。pnpm のストア (既定は
# ~/Library/pnpm/store) に前の postinstall の結果が残っていて link され直すので、
# 止めたことにならず検査が素通りする。実際に一度素通りした。
#
# postinstall がやるのはシムを実体の binary に置き換える最適化で、起動が少し
# 速くなる。それと引き換えに第三者の install script を走らせる価値は無いと
# 判断して false にしている。**増やすときは同じ手順で「本当に要るのか」を
# 確かめること** —— 要る/要らないは直感では当たらない。
allowBuilds:
  "@bufbuild/buf": false
  esbuild: false
  protobufjs: false
  puppeteer: false

# npm の `overrides` の移設先。pnpm 11 は package.json の `overrides` を読まず、
# 書いても無視する (= 脆弱性修正が黙って失われる)。
#
# **脆弱性対応の下限は「修正版そのもの」に置くこと。** override は範囲を狭める
# だけで lockfile を進める力は無いので、下限が脆弱な版を許していると、override が
# あるのに古い版が居座り続ける。brace-expansion の勧告の修正版は >=5.0.9 で、
# 移行前の指定 (^5.0.8) は脆弱な版そのものを許していた。
#
# js-yaml (旧 ^4.3.0) は移していない。移した時点では依存グラフに 1 箇所も無く、
# 何もしていなかったため。いまは astro 経由で入っているが、修正版 (4.3.2) へは
# lockfile の更新で上がる —— override は要らない。
overrides:
  brace-expansion: "^5.0.9"
  axios: "^1.18.1"
