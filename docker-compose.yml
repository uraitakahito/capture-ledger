# Apple Container 上の capture-ledger スタック。動かすのは container-compose
# (https://github.com/Mcrich23/Container-Compose —— Homebrew で入れる)。
#
#   pnpm run stack:up      # 全部 build して起動する
#   pnpm run stack:down    # 停止する。volume (とその中身) は残る
#
# **起こすのは `scripts/stack.sh` から。** container-compose を直に叩くと、この設定が
# 要求する 3 つが渡らない:
#
#   - 署名の `--profile signing` と `--env-file signing.env` の対 (`.env` の 1 行から導く)
#   - submodule の版 (下の build 引数。渡らないで建った image は、BrowserHive が起動を拒む)
#   - 起動の前の点検 (道具・DNS ドメイン・submodule)
#
# 理由は `scripts/stack.sh` の冒頭に書いてある。
#
# マシンごとに 1 度だけ要る用意:
#   sudo container system dns create capture-ledger
# project 名と同じ DNS ドメインがあると、container-compose は real-DNS モードに
# 入る: コンテナは <service>.capture-ledger という名前になり、プラットフォームの DNS に
# 登録され、コンテナどうしがこの名前で呼び合える。host で動く capture-ledger は名前を
# 使わず、下の ports: が 127.0.0.1 に出したポートに繋ぐ —— 名前は host からも引けるが、
# macOS 26 は node の TCP をコンテナの subnet へ通さない (EHOSTUNREACH)。
# container_name: を足してはならない —— DNS の命名が抑止され、`container exec` で
# **各コンテナの中の** /etc/hosts を書き換える方式に落ちる (ホストの /etc/hosts は
# 触らない)。そしてその書き込みは、ここに居る非 root のコンテナ (browserhive,
# chromium) では権限が無くて失敗し、しかも container-compose は何も言わない。
#
# 上流のソースは git URL からではなく .upstream/ の submodule から来る ——
# `container build` は context のディレクトリしか受け取らないため。submodule は 6 本 (.gitmodules):
#
#   .upstream/browserhive        本体と、それが動作確認された版の chromium-server-docker (ここから建てる)
#   .upstream/seaweedfs          object store の検査と片付けの script (package.json の check:store-name・store:wipe)
#   .upstream/replayweb-server   改変していない ReplayWeb.page のビューア (ここから建てる)
#   .upstream/capture-player     ReplayWeb.page を改変した Web Capture のビューア (ここから建てる)
#   .upstream/capture-fixtures   取り込み対象のフィクスチャ (profile: capture-fixtures。ここから建てる)
#   .upstream/capture-scripts    登録済みのスクリプトの元 (pnpm run scripts import が読む)
#
# capture-fixtures を browserhive 越しではなく **直接** vendor しているのは、あちらの pin が
# 別の都合で動くため。capture-ledger の試験が要る頁 (`/links/*` など) が browserhive の pin に入るとは
# 限らない —— 経由すると browserhive の版上げを待つことになる。版はそれぞれの submodule が持つ。
#
# 分けてあるのは、S3 が欲しいだけのときに browserhive 全体を要求しないため。
# 以前は browserhive/etc/seaweedfs を mount していて、そうなっていた。
#
# **chromium-server-docker のスタックとは同時に立てられない** —— 9222 をどちらも publish する。
# browserhive のスタックとは port が重ならない (あちらが番号をずらしてある)。
#
# アーカイブを選ぶ画面 (picker) は capture-api が配る。これは compose に入れず
# host 側で動かす: `pnpm run api`。OpenFGA の store/model の ID が起動後にしか
# 決まらない (`pnpm run fga:deploy` が出力して .env.local に入れる) ため、compose に
# 書けない。

# project 名を固定する。指定しないと container-compose はディレクトリ名から導くが、
# ここでは project 名が そのまま DNS ドメインになる: `container system dns create <name>`
# で作ったドメインと、下に出てくる `<service>.capture-ledger` というホスト名の両方と
# 一致していなければならない。
name: capture-ledger

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=capture_ledger
      - POSTGRES_PASSWORD=capture_ledger
      - POSTGRES_DB=capture_ledger
      # ここでの named volume はフォーマット済みのファイルシステムなので、mount 先には
      # 最初から lost+found が居る。すると initdb が使うことを拒む
      # ("directory exists but is not empty")。クラスタは mount 先の
      # サブディレクトリに置く —— この場合の対処として image 自身が案内している方法。
      - PGDATA=/var/lib/postgresql/data/pgdata
    # host 側の道具 (psql、そして capture-ledger 自身) が名前 (postgres.capture-ledger) でも
    # localhost でも届くように publish している。
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # OpenFGA 自身の保存先。上の `postgres` サービスと共用しないのは意図的。
  #
  # 1 つのインスタンスを共用すると、tuple を capture-ledger のアプリケーション
  # トランザクションの中で書けるかのような思い込みを誘う —— 実際には書けない:
  # OpenFGA へは HTTP API 経由でしか書かず、SQL では書かないので、両方にまたがる
  # トランザクションは存在しない。データベースを分けておくとその境界が目に見える。
  # fga_outbox テーブルが在るのは、まさにそのため。(OpenFGA 自身の docs も専用の
  # データベースを求めている。)
  openfga-db:
    image: docker.io/library/postgres:17-alpine
    environment:
      - POSTGRES_USER=openfga
      - POSTGRES_PASSWORD=openfga
      - POSTGRES_DB=openfga
      # `postgres` サービスと同じ lost+found の問題 —— 上を参照。
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - openfga-db-data:/var/lib/postgresql/data

  openfga:
    image: docker.io/openfga/openfga:v1.10.2
    # datastore を環境変数ではなく **フラグ** で設定しているのは意図的。
    #
    # container-compose は全サービスについて Docker link 形式の変数を注入する
    # (`openfga-db` という名前から OPENFGA_DB_PORT_5432_TCP_ADDR とその仲間)。
    # OpenFGA は設定を viper 経由で OPENFGA_ プレフィックス付きで読むので、それらを
    # 拾ってしまい、読み違える: datastore を env で与えたとき、server は
    # `storage engine '192.168.64.202' is unsupported` と言って panic した ——
    # データベースのコンテナの IP アドレス。フラグは env より優先されるので、
    # 衝突をまるごと回避できる。これらを `environment:` に戻してはならない。
    #
    # `migrate` はここでは走らせていない: この image は distroless で (/bin/sh が無い)、
    # seaweedfs のような entrypoint の再試行ループが書けず、container-compose にも
    # 使い捨てのサービスが無い。`up` のあとに `pnpm run fga:migrate` を走らせること ——
    # server は未 migrate のデータベース相手でも問題なく起動し、migrate されるまで
    # 単に 500 を返す (/healthz も含めて)。
    command:
      - "run"
      - "--datastore-engine=postgres"
      - "--datastore-uri=postgres://openfga:openfga@openfga-db.capture-ledger:5432/openfga?sslmode=disable"
    environment:
      # 既定では認証が一切無い。capture-ledger は publish された loopback のポート越しに
      # OpenFGA へ届くが、それは host 上の他の何かにとっても同じこと。
      # (/healthz は開いたまま —— キーを要求するのは API だけ。)
      - OPENFGA_AUTHN_METHOD=preshared
      - OPENFGA_AUTHN_PRESHARED_KEYS=dev-key
      - OPENFGA_LOG_LEVEL=info
    ports:
      # 8080 ではなく 8090 で publish しているのは、慣例のポートをどのサービスが
      # 持っているかを host 側で推測せずに済ませるため。CAPTURE_LEDGER_FGA_API_URL は
      # 8090 を使うこと。
      - "127.0.0.1:8090:8080"
    depends_on:
      - openfga-db

  # 手元の Cognito の代役 (Floci)。本番の IdP は Amazon Cognito で、capture-ledger はトークンを Cognito の形で
  # 確かめる (src/api/identity.ts)。プール・client・利用者は pnpm run idp:bootstrap (dev:up の段 idp)
  # が作り、iss と client の ID を .env.local に書く (CAPTURE-185)。
  #
  # **サービスの名前を floci にしない。** container-compose は全サービスに Docker link 形式の変数
  # (`<名前>_PORT=tcp://…` とその仲間) を注入する (上の openfga の注記)。floci と名付けると
  # FLOCI_PORT が生え、Floci が自分の設定 (floci.port) として読みかねない。
  #
  # **プールはメモリに持つ。** 作り直すと消え、iss (プールの ID を含む) が替わる。dev:up は毎回
  # idp:bootstrap を打つので揃う。stack:up だけを打ったら pnpm run dev:up --from idp。
  #
  # 管理の API は、Floci の既定の鍵 (test/test) を条件なしに通す (2.4.0 のソースで確かめた)。
  # このネットワークに届く物は誰でも利用者やトークンを作れる —— 開発用の手元のスタックの中の
  # 心配として受け入れた (CAPTURE-185 の段 0)。ホストへは loopback にだけ出す。
  idp:
    # 版は digest で固定する (Floci は nightly を毎日出す)。上げるのは手で、上げたら
    # CAPTURE-185 の段 0 の試し (人と機械のトークン・反証) を流し直す。
    image: docker.io/floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
    environment:
      # トークンの iss の頭。コンテナから idp.capture-ledger の名前で取っても、iss はこの形のまま
      # (Host の見出しに依らない。実測)。capture-ledger はホストの 127.0.0.1 から鍵を取る。
      - FLOCI_BASE_URL=http://127.0.0.1:4566
    ports:
      - "127.0.0.1:4566:4566"

  chromium-1: &chromium
    build:
      # browserhive 自身が動作確認された版の chromium —— submodule の submodule なので、
      # この 2 つは一緒に動く。
      context: ./.upstream/browserhive/chromium-server-docker
      dockerfile: docker/Dockerfile
      target: production
    mem_limit: 4gb
    ports:
      # CDP を host にも出す (loopback のみ)。headless の描画を chrome://inspect で
      # 覗くため —— docs が案内している 9222 / 9223 はここ。
      - "127.0.0.1:9222:9222"
  chromium-2:
    <<: *chromium
    ports:
      - "127.0.0.1:9223:9222"

  # BrowserHive は **browser 1 台にエンドポイント 1 つ** —— queue も pool も無く、走行中に
  # 呼ばれれば 429 Busy で断る。並列に取り込むにはこの対 (browserhive-N と
  # chromium-N) を増やし、空いているエンドポイントを選ぶのは呼ぶ側 (Windmill の flow) の仕事。
  # 2 つ目以降は anchor との差分 (browser、host 側の port、depends_on) だけを書く。
  browserhive-1: &browserhive
    build:
      context: ./.upstream/browserhive
      dockerfile: Dockerfile.prod
      args:
        # 版と revision を image に焼き込む。**`GetServerStatus` に出るだけではない** ——
        # archive の `datapackage.json` (`software` と `browserhive:capture.build`) と
        # WARC の `warcinfo` に入り、署名対象のバイト列の中で確定する。
        #
        # 渡さないと版は "unknown"、revision は "dev" になる。**値は手で書かない** ——
        # `pnpm run stack:up` が `scripts/submodule-versions.sh`
        # から submodule の実際のタグを渡す。生の `container-compose up` を叩くと既定に
        # 落ち、**そうして建った image は BrowserHive が起動を拒む** (v9.4.0 から。
        # `この build は自分の出どころを名乗れない` で exit 1)。
        GIT_TAG: "${BROWSERHIVE_TAG:-}"
        GIT_REV: "${BROWSERHIVE_REV:-dev}"
    ports:
      # HTTP (JSON)。v12 から。v3〜v11 は同じ port で gRPC を喋っていた。TLS の証明書を
      # 渡していないので平文 —— flow のエンドポイントの既定 (http://browserhive-N.capture-ledger:50051) と対。
      - "127.0.0.1:50051:50051"
    # プラットフォームの DNS (<service>.capture-ledger) を使った、名前による結線。
    environment: &browserhive-env
      BROWSERHIVE_BROWSER_URL: http://chromium-1.capture-ledger:9222
      # 宛先は共有 store。**変数で書かない** —— container-compose は environment の
      # `${VAR}` も `${VAR:-既定}` も展開せず、文字列のまま container に渡す (実測:
      # replayweb-server が `S3_BUCKET_URL must be http(s)://…, got: ${S3_ENDPOINT:-…}` で落ちた)。
      BROWSERHIVE_S3_ENDPOINT: http://seaweedfs.crawler-storage:8333
      BROWSERHIVE_S3_REGION: us-east-1
      BROWSERHIVE_S3_BUCKET: browserhive
      BROWSERHIVE_S3_ACCESS_KEY_ID: browserhive
      BROWSERHIVE_S3_SECRET_ACCESS_KEY: browserhive
      # 同梱の SeaweedFS には bucket のサブドメイン用の wildcard DNS が無いので、
      # virtual-hosted 形式のアドレス指定は失敗する。path 形式なら同梱のスタックが
      # そのまま動く。AWS へ向けるときは設定しないでおくこと。
      BROWSERHIVE_S3_FORCE_PATH_STYLE: "true"
      LOG_LEVEL: info
      # entrypoint の shim が、server を起動する前にここを叩いて待つ —— depends_on は
      # 起動順序でしかなく、起動時の HeadBucket は失敗すると致命的なため。
      WAIT_FOR_S3: http://seaweedfs.crawler-storage:8333
      # プラットフォームの DNS は AAAA レコードも publish するが、VM 間に v6 の経路は
      # 無い —— v4 を先に引かせないと、browser の WS URL が到達できない v6 アドレスに
      # 着地する。
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # 取り込み対象がこのスタックの中に居るので、私設アドレスへの取り込みを許す
      # (seaweedfs の filer、replayweb-server など。クロールの往復もこれが無いと組めない)。
      # **メタデータ(169.254)とループバックはこれでも閉じたまま。**
      # 開発スタック限定で、本番の既定は off (SSRF 対策)。browserhive の compose にも
      # 同じ設定が同じ理由で入っている。
      BROWSERHIVE_ALLOW_PRIVATE_TARGETS: "true"
      # WARC の本を 1 MiB で切り替える（BrowserHive v21・profile 1.14.0）。本番の既定は 1 GB。dev で
      # 多本の WACZ（archive/data-000・001…）を毎日作り、capture-workbench と validator がそれを読む所を踏ませる。
      # fixtures の /warc/rollover（8 × 250,000 バイト）がちょうど 2 本に分かれる大きさ。
      BROWSERHIVE_WACZ_MAX_WARC_BYTES: "1048576"
      #
      # **署名の設定はここに書かない。** `signing.env` に在り、`scripts/stack.sh` が
      # `CAPTURE_LEDGER_CAPTURE_SIGNING=1` のときだけ `--env-file` で注ぐ。
      #
      # ここに無条件で置くと、"signing" profile を起こしていないスタックが
      # 「宛先は在るが相手が居ない」状態になる —— 実際にそうなっていて、
      # 署名を有効にした取り込みが全部 `ENOTFOUND wacz-signer.capture-ledger` で落ちた。
      # **空文字で無効化することはできない**（理由は `signing.env` の冒頭）。
    volumes:
      # 署名の anchor は **このコンテナの中の** パスなので、wacz-signer が署名に使う
      # identity はここからも読めなければならない。
      #
      # **mount は無条件のまま。** 読み取り専用の fixture で、`signing.env` が
      # 指さない限り誰も読まない —— 起動の条件を 1 つ増やすほうが害が大きい。
      - ./.upstream/browserhive/dev-stack/signing-ca:/dev-ca:ro
    depends_on:
      - chromium-1

  browserhive-2:
    <<: *browserhive
    ports:
      - "127.0.0.1:50052:50051"
    environment:
      <<: *browserhive-env
      BROWSERHIVE_BROWSER_URL: http://chromium-2.capture-ledger:9222
    depends_on:
      - chromium-2

  # wacz-auth の署名サービス。browserhive のスタックにあるものと同じ構成で、
  # build context だけ pin 済みの upstream (`.upstream/browserhive`) の下を指す —— wacz-signer も
  # timestamp-authority も、あちらの submodule として既に手元に在る。
  #
  # 独自の CA を発行するので、ここが作る署名を信頼する者は居ない。それでよく、
  # 確かめたいのは「署名の経路が最後まで繋がっているか」であって「誰が信頼するか」
  # ではない。
  wacz-signer:
    build:
      context: ./.upstream/browserhive/wacz-signer
    # --host 0.0.0.0 にするのは、wacz-signer の既定が 127.0.0.1 で他のコンテナから
    # 一切届かないため。
    command: [
        "serve",
        "--dir",
        "/id",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--token",
        "dev-token",
        # timestamp の出どころ。wacz-signer は v0.5.0 以降 自前では発行しないので、これが
        # 無いと作る署名すべてに timeSignature が付かず、timestamp の検査が `skipped`
        # に落ちる。
        "--tsa-url",
        "http://tsa.capture-ledger:3004/api/v1/timestamp",
      ]
    volumes:
      - ./.upstream/browserhive/dev-stack/signing-ca:/id:ro
    ports:
      # host で動く capture-ledger (API と replay-bundle:rebuild) が、終わったクロールの合本に署名を貰うポート
      # (CAPTURE_LEDGER_SIGNER_URL=http://127.0.0.1:18091/sign)。BrowserHive のコンテナは今までどおり名前で
      # 引く (signing.env)。**18090 ではない** —— BrowserHive のスタックの wacz-signer が 18090 に出ていて、
      # 同じ dev の CA で署名する。番号を分けないと、取り違えても署名が通り、どちらのスタックに頼んだかが
      # 分からない。
      - "127.0.0.1:18091:8080"
    # 買えるのは起動順だけ —— container-compose に healthcheck が無い。TSA が待ち受ける
    # 前に署名しようとすると、timestamp の無い署名ができるのではなく **取り込みが
    # 失敗する**。ここで望ましいのはそちら。
    depends_on:
      - tsa
    profiles: ["signing"]

  # RFC 3161 の timestamp。sigstore/timestamp-authority を使う。
  tsa:
    build:
      context: ./.upstream/browserhive/timestamp-authority
      target: "deploy"
    # この image が設定しているのは ENTRYPOINT ではなく CMD なので、バイナリ名をここで書く。
    command: [
        "timestamp-server",
        "serve",
        "--host=0.0.0.0",
        "--port=3004",
        "--timestamp-signer=file",
        "--file-signer-key-path=/id/insecure-dev-tsa.key",
        "--certificate-chain-path=/id/insecure-dev-tsa-chain.pem",
        # 既定は false で、そうするとトークンに leaf しか入らず、どの timestampCert も
        # root を欠く。**この環境では何も失敗しない** —— BrowserHive は設定された anchor と
        # 突き合わせるので `ok` と答え続ける。壊れるのは「アーカイブ単体で読む」ほうで、
        # それをやるのが `wacz-signer verify`。
        "--include-chain-in-response=true",
        # このネットワークから公開 NTP への経路が無い。致命的ではないが、周期ごとに
        # ログを出し続ける。
        "--disable-ntp-monitoring=true",
      ]
    volumes:
      - ./.upstream/browserhive/dev-stack/signing-ca:/id:ro
    profiles: ["signing"]

  # クロールの e2e が辿るフィクスチャ origin。既定では起動しない:
  #
  #   pnpm run stack:up --profile capture-fixtures capture-fixtures
  #
  # **host 側からは loopback で引く。** macOS 26 では Apple 署名でないバイナリ (node) が
  # コンテナの subnet へ TCP を張れず、DNS 名は引けるのに `EHOSTUNREACH` になる
  # (実測 2026-09-20: 同じ URL に curl は 200、node は EHOSTUNREACH)。browserhive が
  # v10.6.0 で全部のポートを loopback へ寄せたのと同じ理由で、ここも publish する。
  #
  # **コンテナ側からは今までどおり名前で引く** —— 取り込むのは browserhive なので、
  # 起点の URL は capture-fixtures.capture-ledger:8080 のままでなければならない。
  # つまりこの面は 2 つの宛先を持つ: 中からは名前、外からは 127.0.0.1:18080。
  #
  # 取り込み対象がここに居るので、browserhive 側に
  # BROWSERHIVE_ALLOW_PRIVATE_TARGETS=true が要る (上に入れてある)。
  capture-fixtures:
    build:
      context: ./.upstream/capture-fixtures
      args:
        # browserhive と同じ理由。capture-fixtures は `/__version` でこれを出す。
        GIT_TAG: "${CAPTURE_FIXTURES_TAG:-}"
        GIT_REV: "${CAPTURE_FIXTURES_REV:-dev}"
    profiles: ["capture-fixtures"]
    ports:
      # e2e と doctor が host の node から叩くポート。**browserhive の e2e スタックと
      # 番号を分ける** —— あちらは 18080-18082 を publish するので、両方を同時に
      # 起こすと後から起きたほうが bind できずに落ちる (実測 2026-09-20:
      # `Service 'capture-fixtures' failed to start`、しかも 18080 には
      # **browserhive 側の fixtures が答え続ける**ので、気づかずに緑を見る)。
      - "127.0.0.1:18085:8080"

  # 改変していない ReplayWeb.page のビューア (ReplayWeb.page と互換の再生)。picker と workbench の
  # 「ReplayWeb.page ↗」がここへ ?source=/wacz/<key> で渡す。
  #
  # picker を配る capture-api は **host 側で動かす** (`pnpm run api`) —— capture-ledger 自身と
  # 同じ。compose に入れられないのは、OpenFGA の store/model の ID が起動後にしか
  # 決まらないため (`pnpm run fga:deploy` が出力し、.env.local に入れる)。
  replayweb-server:
    build:
      context: ./.upstream/replayweb-server
      args:
        # browserhive と同じ理由。replayweb-server は `/__version` に書き出す。
        GIT_TAG: "${REPLAYWEB_SERVER_TAG:-}"
        GIT_REV: "${REPLAYWEB_SERVER_REV:-dev}"
    environment:
      # 上流は複合値で渡す。素のサービス名を値に書くと container-compose が
      # その IP に書き換えてしまい、読みが全部 403 になる (browserhive で実測)。
      - S3_BUCKET_URL=http://seaweedfs.crawler-storage:8333/browserhive
    ports:
      # loopback であることが要件。Service Worker は secure context (https か
      # loopback) でしか登録できないので、DNS 名で開くと **ページは出るのに
      # アーカイブが永久に開かない**。公開範囲の話ではない。
      - "127.0.0.1:8899:8080"

  # ReplayWeb.page と wabac.js を改変した Web Capture のビューア (CAPTURE-102)。workbench の
  # 「Web Capture ↗」がここへ、replayweb-server と同じ形の ?source=/wacz/<key> で渡す。server は
  # replayweb-server と同じコードで、/wacz/ と /q/ の形も同じ。image はビューアを Node 24 で build する
  # (Apple Container の builder の 2 GB で、最大 1.88 GiB・75 秒。2026-11-12 に実測)。
  capture-player:
    build:
      context: ./.upstream/capture-player
      args:
        # /__version・/SOURCE.txt・About に出る (About のソースのリンクはこのタグを指す。AGPL §13)
        GIT_TAG: "${CAPTURE_PLAYER_TAG:-}"
        GIT_REV: "${CAPTURE_PLAYER_REV:-dev}"
    environment:
      # replayweb-server と同じ理由で複合値
      - S3_BUCKET_URL=http://seaweedfs.crawler-storage:8333/browserhive
    ports:
      # replayweb-server と同じ理由で loopback
      - "127.0.0.1:8897:8080"

  # 全文検索の索引。capture-ledger の API は検索が無いと起動しない (CAPTURE-53)。dev では dev:up の段 search が
  # **サービス名を付けて**起こす (名前を付け忘れると、全部のコンテナが作り直される):
  #
  #   pnpm run stack:up --profile search opensearch
  #
  # **開発スタック限定の設定が 2 つ入っている。** security plugin を切っているので
  # 認証も TLS も無く、`discovery.type=single-node` なので冗長性も無い。API に
  # 触れるのは capture-ledger だけ (`CAPTURE_LEDGER_OPENSEARCH_URL`) で、認可は OpenFGA が持つ ——
  # 索引そのものは誰に見せてよいかを知らない (`api/search.ts` に理由がある)。
  #
  # 解析器は組み込みの `cjk`。kuromoji は plugin の導入が要り、既製イメージでは
  # 動かない (`src/search/client.ts`)。
  opensearch:
    image: docker.io/opensearchproject/opensearch:3.8.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      # 既定は 1g。開発では 512m で足りるうえ、このスタックは他に 10 本以上
      # 動いている。
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # disk の残りで索引を読み専用にする閾値を切る (開発機の disk が埋まっていても書ける)。
      # 1 ノードなので replica は割り当たらず、health は yellow のまま —— それで検索も索引も効く。
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      # capture-ledger の API は host で動くので、このポートで引く (CAPTURE_LEDGER_OPENSEARCH_URL)。
      # 索引を直に覗くのもここ (`curl 127.0.0.1:9200/_cat/indices`)。
      - "127.0.0.1:9200:9200"
    # JVM は 512m の heap の外にも要る。2g は実測ではなく安全側の見積り。
    mem_limit: 2gb
    # **ボリュームを持たせない。** 名前付きボリュームは root 所有で作られ、
    # OpenSearch は uid 1000 で動くので `data/nodes` を作れず
    # `AccessDeniedException` で起動に失敗する (実測)。
    #
    # 所有者を直して持たせることもできるが、**持たせる利得が小さい**: 索引は
    # pnpm run search:reindex で作り直せる (capture-ledger の indexed_at を空にして入れ直す)。
    # 落とせば消えるが、消えても困らないように作ってある。
    profiles: ["search"]

volumes:
  postgres-data:
  openfga-db-data:
