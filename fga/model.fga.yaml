# fga/model.fga に対する assertion。`pnpm run fga:test` (OpenFGA CLI) が走らせる。
#
# ここに並ぶのは、署名の endpoint が実際に投げている問いそのもの。どれか 1 つでも
# 裏返れば、見えてはいけない相手に WACZ が見える。つまりこのファイルは形式ではなく、
# 認可の設計全体に対する回帰の網。
name: capture-ledger authorization model
model_file: ./model.fga

# 保存される状態。**ここに無いもの**に注意 —— user → organization の所属が無い。
# あれは呼び出し元のトークンから contextual tuple として届くので、下の試験も
# 本番と同じ渡し方をしている。
tuples:
  - user: user:alice
    relation: owner
    object: capture_job:job-1
  - user: organization:acme
    relation: parent
    object: capture_job:job-1
  - user: capture_job:job-1
    relation: parent
    object: archive:arch-1

  # 隔離を示すための、もう 1 つの組織のアーカイブ。
  - user: organization:contoso
    relation: parent
    object: capture_job:job-2
  - user: capture_job:job-2
    relation: parent
    object: archive:arch-2

tests:
  - name: ジョブの owner は、そこから生まれたものを見られる
    check:
      - user: user:alice
        object: archive:arch-1
        assertions:
          can_view: true
          can_delete: true

  - name: 所有する組織の member は、見られるが消せない
    # 所属は contextual に渡す —— API が JWT から渡すのとまったく同じ形。
    tuples:
      - user: user:bob
        relation: member
        object: organization:acme
    check:
      - user: user:bob
        object: archive:arch-1
        assertions:
          can_view: true
          can_delete: false

  - name: 無関係な利用者には何も見えない
    check:
      - user: user:mallory
        object: archive:arch-1
        assertions:
          can_view: false
          can_delete: false

  - name: 別の組織に属していても何も得られない
    tuples:
      - user: user:carol
        relation: member
        object: organization:contoso
    check:
      - user: user:carol
        object: archive:arch-1
        assertions:
          can_view: false
      - user: user:carol
        object: archive:arch-2
        assertions:
          can_view: true

  - name: 直接の共有は、その窓の内側では見える
    tuples:
      - user: user:dave
        relation: viewer
        object: archive:arch-1
        condition:
          name: non_expired_grant
          context:
            grant_time: "2026-07-29T00:00:00Z"
            grant_duration: 168h
    check:
      - user: user:dave
        object: archive:arch-1
        context:
          current_time: "2026-07-30T00:00:00Z"
        assertions:
          can_view: true

  - name: 同じ共有が、窓を過ぎれば切れている
    tuples:
      - user: user:dave
        relation: viewer
        object: archive:arch-1
        condition:
          name: non_expired_grant
          context:
            grant_time: "2026-07-29T00:00:00Z"
            grant_duration: 168h
    check:
      - user: user:dave
        object: archive:arch-1
        context:
          current_time: "2026-08-30T00:00:00Z"
        assertions:
          can_view: false

  - name: 共有されたアーカイブも、受け取った側は消せない
    tuples:
      - user: user:dave
        relation: viewer
        object: archive:arch-1
        condition:
          name: non_expired_grant
          context:
            grant_time: "2026-07-29T00:00:00Z"
            grant_duration: 168h
    check:
      - user: user:dave
        object: archive:arch-1
        context:
          current_time: "2026-07-30T00:00:00Z"
        assertions:
          can_delete: false

  - name: 保存された submitter は取り込みを始められる
    tuples:
      - user: user:bob
        relation: submitter
        object: organization:acme
    check:
      - user: user:bob
        object: organization:acme
        assertions:
          can_submit: true

  - name: 組織の admin も始められる
    tuples:
      - user: user:erin
        relation: admin
        object: organization:acme
    check:
      - user: user:erin
        object: organization:acme
        assertions:
          can_submit: true

  # この 1 本がこのモデルの要。所属は呼び出し元の申告なので、これが true になる形に
  # 書くと検査そのものが無意味になる (`model.fga` の `submitter` の注記を見ること)。
  - name: 所属しているだけでは取り込みを始められない
    tuples:
      - user: user:carol
        relation: member
        object: organization:acme
    check:
      - user: user:carol
        object: organization:acme
        assertions:
          can_submit: false
          # 所属そのものは効いている。効いていないのは can_submit への経路だけ。
          member: true

  - name: 別の組織の submitter は、その組織でしか始められない
    tuples:
      - user: user:dave
        relation: submitter
        object: organization:contoso
    check:
      - user: user:dave
        object: organization:acme
        assertions:
          can_submit: false
      - user: user:dave
        object: organization:contoso
        assertions:
          can_submit: true

  - name: 何も持たない利用者は始められない
    check:
      - user: user:mallory
        object: organization:acme
        assertions:
          can_submit: false
